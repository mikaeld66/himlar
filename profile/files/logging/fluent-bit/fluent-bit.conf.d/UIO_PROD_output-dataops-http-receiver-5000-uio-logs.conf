[OUTPUT]
    Name   http
    Match  uio_logs_5000_*

    Host   dataops-rec-uio.educloud.no
    Port   5000

    Format json
    Workers 1
    storage.total_limit_size  100M
    Retry_Limit no_limits

    tls On
    tls.verify On
    tls.ca_file /etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem
    tls.crt_file /var/nivlheim/my.crt
    tls.key_file /var/nivlheim/my.key
    #tls.debug 4

